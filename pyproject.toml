[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openvpn-ui"
version = "0.3.0"
description = "Web UI/API for OpenVPN Community servers (pairs with angristan/openvpn-install)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "amachulan" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
openvpn-ui = "openvpn_ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openvpn_ui = ["web/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
