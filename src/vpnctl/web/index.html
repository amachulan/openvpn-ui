<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vpnctl</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script>
    (() => {
      const themeKey = "vpnctl_theme";
      const langKey = "vpnctl_lang";
      const savedTheme = localStorage.getItem(themeKey);
      const theme = savedTheme === "light" || savedTheme === "dark"
        ? savedTheme
        : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
      const savedLang = localStorage.getItem(langKey);
      const lang = savedLang === "ru" || savedLang === "en"
        ? savedLang
        : (navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en";
      document.documentElement.setAttribute("data-lang", lang);
      document.documentElement.lang = lang;
    })();
  </script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>vpnctl</h1>
      <p class="tag" data-i18n="tag">OpenVPN Community management</p>
    </div>
    <div class="token-box">
      <label for="token" data-i18n="token_label">API token</label>
      <input id="token" type="password" autocomplete="off" data-i18n-placeholder="token_placeholder" placeholder="Bearer token" />
      <button type="button" id="save-token" class="secondary" data-i18n="save">Save</button>
      <button type="button" id="lang-toggle" class="secondary icon-btn" title="Language" aria-label="Language">RU</button>
      <button type="button" id="theme-toggle" class="secondary icon-btn" title="Theme" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="clients" data-i18n="tab_clients">Clients</button>
    <button type="button" class="tab" data-tab="issue" data-i18n="tab_issue">Issue</button>
    <button type="button" class="tab" data-tab="sessions" data-i18n="tab_sessions">Sessions</button>
    <button type="button" class="tab" data-tab="audit" data-i18n="tab_audit">Audit</button>
  </nav>

  <main>
    <p id="status" class="status" hidden></p>

    <section id="panel-clients" class="panel active">
      <div class="panel-head">
        <h2 data-i18n="clients_title">Clients</h2>
        <button type="button" id="refresh-clients" data-i18n="refresh">Refresh</button>
      </div>
      <div id="expiry-banner" class="banner" hidden></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="col_cn">CN</th>
              <th data-i18n="col_status">Status</th>
              <th data-i18n="col_expires">Expires</th>
              <th data-i18n="col_label">Label</th>
              <th data-i18n="col_online">Online</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="clients-body"></tbody>
        </table>
      </div>
    </section>

    <section id="panel-issue" class="panel">
      <div class="panel-head"><h2 data-i18n="issue_title">Issue client</h2></div>
      <form id="issue-form" class="form">
        <label><span data-i18n="form_cn">Client name</span> <input name="cn" required pattern="[A-Za-z0-9_-]{1,64}" /></label>
        <label><span data-i18n="form_days">Validity (days)</span> <input name="days" type="number" value="3650" min="1" /></label>
        <label><span data-i18n="form_label">Label</span> <input name="label" /></label>
        <label><span data-i18n="form_notes">Notes</span> <input name="notes" /></label>
        <label><span data-i18n="form_email">Email</span> <input name="email" type="email" /></label>
        <label><span data-i18n="form_telegram">Telegram chat id</span> <input name="telegram_chat_id" /></label>
        <label class="check"><input name="deliver_email" type="checkbox" /> <span data-i18n="form_deliver_email">Email .ovpn after issue</span></label>
        <label class="check"><input name="deliver_telegram" type="checkbox" /> <span data-i18n="form_deliver_telegram">Telegram .ovpn after issue</span></label>
        <button type="submit" data-i18n="form_issue">Issue</button>
      </form>
    </section>

    <section id="panel-sessions" class="panel">
      <div class="panel-head">
        <h2 data-i18n="sessions_title">Sessions</h2>
        <button type="button" id="refresh-sessions" data-i18n="refresh">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="col_cn">CN</th>
              <th data-i18n="col_real">Real address</th>
              <th data-i18n="col_virtual">Virtual IP</th>
              <th data-i18n="col_since">Since</th>
              <th data-i18n="col_traffic">Traffic</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="sessions-body"></tbody>
        </table>
      </div>
    </section>

    <section id="panel-audit" class="panel">
      <div class="panel-head">
        <h2 data-i18n="audit_title">Audit</h2>
        <button type="button" id="refresh-audit" data-i18n="refresh">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="col_time">Time</th>
              <th data-i18n="col_action">Action</th>
              <th data-i18n="col_cn">CN</th>
              <th data-i18n="col_detail">Detail</th>
            </tr>
          </thead>
          <tbody id="audit-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
