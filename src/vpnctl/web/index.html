<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vpnctl</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>vpnctl</h1>
      <p class="tag">OpenVPN Community management</p>
    </div>
    <div class="token-box">
      <label for="token">API token</label>
      <input id="token" type="password" autocomplete="off" placeholder="Bearer token" />
      <button type="button" id="save-token">Save</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="clients">Clients</button>
    <button type="button" class="tab" data-tab="issue">Issue</button>
    <button type="button" class="tab" data-tab="sessions">Sessions</button>
    <button type="button" class="tab" data-tab="audit">Audit</button>
  </nav>

  <main>
    <p id="status" class="status" hidden></p>

    <section id="panel-clients" class="panel active">
      <div class="panel-head">
        <h2>Clients</h2>
        <button type="button" id="refresh-clients">Refresh</button>
      </div>
      <div id="expiry-banner" class="banner" hidden></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>CN</th>
              <th>Status</th>
              <th>Expires</th>
              <th>Label</th>
              <th>Online</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="clients-body"></tbody>
        </table>
      </div>
    </section>

    <section id="panel-issue" class="panel">
      <div class="panel-head"><h2>Issue client</h2></div>
      <form id="issue-form" class="form">
        <label>Client name <input name="cn" required pattern="[A-Za-z0-9_-]{1,64}" /></label>
        <label>Validity (days) <input name="days" type="number" value="3650" min="1" /></label>
        <label>Label <input name="label" /></label>
        <label>Notes <input name="notes" /></label>
        <label>Email <input name="email" type="email" /></label>
        <label>Telegram chat id <input name="telegram_chat_id" /></label>
        <label class="check"><input name="deliver_email" type="checkbox" /> Email .ovpn after issue</label>
        <label class="check"><input name="deliver_telegram" type="checkbox" /> Telegram .ovpn after issue</label>
        <button type="submit">Issue</button>
      </form>
    </section>

    <section id="panel-sessions" class="panel">
      <div class="panel-head">
        <h2>Sessions</h2>
        <button type="button" id="refresh-sessions">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>CN</th>
              <th>Real address</th>
              <th>Virtual IP</th>
              <th>Since</th>
              <th>Traffic</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="sessions-body"></tbody>
        </table>
      </div>
    </section>

    <section id="panel-audit" class="panel">
      <div class="panel-head">
        <h2>Audit</h2>
        <button type="button" id="refresh-audit">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Action</th>
              <th>CN</th>
              <th>Detail</th>
            </tr>
          </thead>
          <tbody id="audit-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
